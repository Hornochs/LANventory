# LANventory with Docker Compose, data in a local directory (./data).
#
# The container runs as user lanventory (UID 100, GID 101). The directory must belong to
# that user, otherwise the container cannot write to it. Before the first start:
#
#   mkdir -p data && sudo chown 100:101 data
#
# Start:             docker compose -f compose.bind.yaml up -d
# First admin user:  docker compose -f compose.bind.yaml exec lanventory lanventory user create admin --role admin
# Logs:              docker compose -f compose.bind.yaml logs -f lanventory
# Update:            docker compose -f compose.bind.yaml pull && docker compose -f compose.bind.yaml up -d
# Backup:            docker compose -f compose.bind.yaml exec lanventory lanventory backup
#                    (writes a consistent copy to ./data/backups; also keep a copy of
#                    secret.key, see docs/installation.md)
#
# To let Docker manage the data in a named volume instead, use compose.yaml.

services:
  lanventory:
    # Pin a version tag like 0.1.0 for production.
    image: ghcr.io/lan-dot-party/lanventory:latest
    restart: unless-stopped
    ports:
      # Loopback only, for a reverse proxy on the same host.
      # Use "9060:9060" to expose the port directly.
      - "127.0.0.1:9060:9060"
    environment:
      # The exact public origin users open in the browser. It is needed for secure cookies
      # and passkeys (WebAuthn), which require the exact HTTPS origin.
      LANVENTORY_PUBLIC_URL: https://inventory.example.org
      TZ: Europe/Berlin
    volumes:
      - ./data:/var/lib/lanventory
      # Optional: use your own configuration (read-only).
      # - ./config.yaml:/etc/lanventory/config.yaml:ro
