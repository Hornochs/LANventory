{{define "content"}}
<section class="login card">
  <h1><img src="/static/icon.svg" alt="" width="32" height="32"> LANventory</h1>
  <form method="post" action="/login">
    <input type="hidden" name="_login_csrf" value="{{.Data.CSRF}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label>{{.T "login.username"}}<input name="username" autocomplete="username webauthn" required autofocus value="{{.Data.Username}}"></label>
    <label>{{.T "login.password"}}<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">{{.T "login.submit"}}</button>
  </form>
  {{if .Data.Passkeys}}
  <div data-passkey-support hidden>
    <p class="divider"><span>{{.T "login.or"}}</span></p>
    <button type="button" class="secondary wide" data-passkey="get" data-msg-cancel="{{.T "error.passkey_cancelled"}}" data-login-csrf="{{.Data.CSRF}}"
      data-options="/login/passkey/options" data-finish="/login/passkey/finish?next={{urlquery .Data.Next}}">{{.T "login.passkey"}}</button>
    <p class="alert alert-error" data-passkey-error hidden></p>
  </div>
  {{end}}
  <p class="muted small">{{.T "login.hint"}}</p>
</section>
{{end}}
