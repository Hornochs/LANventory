{{define "content"}}
<section class="login card">
  <h1><img src="/static/icon.svg" alt="" width="32" height="32"> {{.T "mfa.title"}}</h1>
  {{if .Data.TOTP}}
  <form method="post" action="/login/mfa">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label>{{.T "mfa.code"}}<input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus maxlength="16"></label>
    <button type="submit" class="primary">{{.T "mfa.verify"}}</button>
  </form>
  {{end}}
  {{if .Data.Passkeys}}
  <div class="passkey-block" data-passkey-support hidden>
    {{if .Data.TOTP}}<p class="divider"><span>{{.T "login.or"}}</span></p>{{end}}
    <button type="button" class="{{if .Data.TOTP}}secondary{{else}}primary{{end}} wide" data-passkey="get" data-msg-cancel="{{.T "error.passkey_cancelled"}}"
      data-options="/login/mfa/passkey/options" data-finish="/login/mfa/passkey/finish?next={{urlquery .Data.Next}}">{{.T "mfa.use_passkey"}}</button>
    <p class="alert alert-error" data-passkey-error hidden></p>
  </div>
  {{end}}
  <details class="small">
    <summary>{{.T "mfa.recovery"}}</summary>
    <form method="post" action="/login/mfa">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <input type="hidden" name="next" value="{{.Data.Next}}">
      <label>{{.T "mfa.recovery_code"}}<input name="code" autocomplete="off" required maxlength="16" placeholder="XXXXX-XXXXX"></label>
      <button type="submit">{{.T "mfa.verify"}}</button>
    </form>
  </details>
  <form method="post" action="/login/mfa/cancel"><input type="hidden" name="_csrf" value="{{.CSRF}}">
    <button type="submit" class="link small">{{.T "mfa.cancel"}}</button></form>
</section>
{{end}}
