version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
    ignore:
      # v0.16+ requires Go 1.25; the project stays on Go 1.24 (see CLAUDE.md).
      - dependency-name: github.com/go-webauthn/webauthn
        versions: [">= 0.16.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
